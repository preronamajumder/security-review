
name: security-review

on:
  workflow_call:
    secrets:
      copilot_github_token:
        description: Fine-grained PAT with Copilot Requests permission
        required: true

permissions:
  contents: read

jobs:
  security-review:
    name: Copilot Security Review
    runs-on: ubuntu-latest

    steps:
      # Checkout the application repository and its PR code.
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Fetch the trusted skill repository separately.
      - name: Checkout trusted security skills
        uses: actions/checkout@v6
        with:
          repository: preronamajumder/security-review
          ref: main
          path: trusted-skills
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # Verify that Copilot discovers the centrally maintained skill.
      - name: Verify security skill
        run: copilot skill list

      - name: Run Copilot Security Review
        run: |
          set -o pipefail

          copilot -p "/security-review" \
            --add-dir trusted-skills \
            --allow-tool='read,grep,glob,skill,shell(git diff:*)' \
            --deny-tool='write' \
            --silent \
            | tee security-review-report.md
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot_github_token }}

      - name: Upload security review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-report
          path: security-review-report.md
          if-no-files-found: ignore
